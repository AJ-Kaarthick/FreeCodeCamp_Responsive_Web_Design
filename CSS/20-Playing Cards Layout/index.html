<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="playing-cards">

    <!-- Card 1: Ace of Spades -->
    <div class="card spade">
      <div class="left">
        <span class="value">A</span>
        <span class="suit">♠</span>
      </div>
      <div class="middle">
        <span class="center-suit">♠</span>
      </div>
      <div class="right">
        <span class="value">A</span>
        <span class="suit">♠</span>
      </div>
    </div>

    <!-- Card 2: King of Hearts -->
    <div class="card heart">
      <div class="left">
        <span class="value">K</span>
        <span class="suit">♥</span>
      </div>
      <div class="middle">
        <span class="center-suit">♥</span>
        <span class="center-suit inverted">♥</span>
      </div>
      <div class="right">
        <span class="value">K</span>
        <span class="suit">♥</span>
      </div>
    </div>

    <!-- Card 3: Queen of Diamonds -->
    <div class="card diamond">
      <div class="left">
        <span class="value">Q</span>
        <span class="suit">♦</span>
      </div>
      <div class="middle">
        <span class="center-suit">♦</span>
        <span class="center-suit inverted">♦</span>
      </div>
      <div class="right">
        <span class="value">Q</span>
        <span class="suit">♦</span>
      </div>
    </div>

    <!-- Card 4: 10 of Clubs -->
    <div class="card club">
      <div class="left">
        <span class="value">10</span>
        <span class="suit">♣</span>
      </div>
      <div class="middle">
        <span class="center-suit">♣</span>
        <span class="center-suit inverted">♣</span>
      </div>
      <div class="right">
        <span class="value">10</span>
        <span class="suit">♣</span>
      </div>
    </div>

  </main>
</body>

</html>
